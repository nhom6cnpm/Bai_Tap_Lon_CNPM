name: brewlite
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD:-brewlite_local}@db:5432/brewlite
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/demo/orders').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
volumes:
  postgres_data:
